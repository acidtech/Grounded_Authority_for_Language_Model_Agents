[project]
name = "chrgate"
version = "0.1.0"
description = "Example CHR gate core for the Claude Code and Codex plugins (C32 Appendix A)"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Nathan Scherdin", email = "nathan@basicmicro.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3"]

[project.urls]
Homepage = "https://github.com/acidtech/Grounded_Authority_for_Language_Model_Agents"
Repository = "https://github.com/acidtech/Grounded_Authority_for_Language_Model_Agents"
Issues = "https://github.com/acidtech/Grounded_Authority_for_Language_Model_Agents/issues"

[project.scripts]
chrgate-mcp = "chrgate.server.app:main"
chrgate-setup = "chrgate.server.setup:main"
chrgate-hook = "chrgate.hooks.cli:main"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.7.21,<0.8"]
build-backend = "uv_build"

# CHR gate spike: codex 0.162.1 config fragment. Never copied into ~/.codex:
# run_codex_probe.sh turns every second-level table of this file into one
# `-c key=<inline TOML>` override (for example `-c mcp_servers.probe={...}`
# and `-c hooks.PreToolUse=[...]`). Hook commands start with `env` so they
# work whether codex runs them through a shell or as a split argv.

[mcp_servers.probe]
command = "/home/acidtech/.local/bin/uv"
args = ["run", "--no-project", "--quiet", "--with", "mcp>=2.3,<3", "python", "/home/acidtech/Ground_Authority_for_Language_Model_Agents/scripts/spike/probe_mcp_server.py"]
env = { CHR_SPIKE_OUT = "/tmp/chr-gate-spike/codex", PYTHONDONTWRITEBYTECODE = "1" }
# Pass the runner's run label through so mcp.jsonl records carry it (codex
# starts MCP servers with a filtered environment; the first run logged label null).
env_vars = ["CHR_SPIKE_LABEL"]
startup_timeout_sec = 60
# MCP tool approval (codex 0.162.1): "approve" means the server's tools never
# need approval. The default "auto" decides from the tool annotations; in the
# first run it required approval for the probe tools, and approval_policy="never"
# turned that into "MCP tool call requires approval, but approval policy is
# never". Values: auto | prompt | writes | approve (see README).
default_tools_approval_mode = "approve"

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "env CHR_SPIKE_OUT=/tmp/chr-gate-spike/codex PYTHONDONTWRITEBYTECODE=1 python3 /home/acidtech/Ground_Authority_for_Language_Model_Agents/scripts/spike/probe_hook.py --host codex --event SessionStart"
timeout = 30

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "env CHR_SPIKE_OUT=/tmp/chr-gate-spike/codex PYTHONDONTWRITEBYTECODE=1 python3 /home/acidtech/Ground_Authority_for_Language_Model_Agents/scripts/spike/probe_hook.py --host codex --event UserPromptSubmit"
